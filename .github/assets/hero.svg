<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Steven Naliwajka. I code and build things.">
  <title>Steven Naliwajka. I code and build things.</title>
  <style>
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    /* Resting state is the finished picture (viewers that skip animation show it);
       animations only add the entrance, holding their first frame through each delay. */
    .fold { transform-box: fill-box; animation: fold .7s cubic-bezier(.2,.7,.25,1) backwards; }
    .f1 { animation-delay: .2s; } .f2 { animation-delay: .45s; } .f3 { animation-delay: .7s; } .f4 { animation-delay: .95s; }
    .rise { animation: rise .9s ease-out backwards; }
    .d1 { animation-delay: .5s; } .d2 { animation-delay: .8s; } .d3 { animation-delay: 1.1s; } .d4 { animation-delay: 1.4s; }
    .c2, .c3 { opacity: 0; }
    .cycle { animation: cycle 12s linear infinite both; }
    .c1 { animation-delay: 1.6s; } .c2 { animation-delay: 5.6s; } .c3 { animation-delay: 9.6s; }
    @keyframes fold { from { opacity: 0; transform: translateY(-18px); } to { opacity: 1; transform: none; } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes cycle { 0% { opacity: 0; } 4% { opacity: 1; } 30% { opacity: 1; } 34% { opacity: 0; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .fold, .rise, .cycle { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12070c"/>
      <stop offset=".55" stop-color="#2a0b16"/>
      <stop offset="1" stop-color="#5a1428"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/>
    </pattern>
    <pattern id="grid5" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#fff" stroke-opacity=".07"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="card"><rect width="1200" height="340" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#grid5)"/>
    <path d="M -60 318 C 320 210, 720 400, 1260 236" fill="none" stroke="#D62828" stroke-opacity=".10" stroke-width="70"/>

    <!-- Red Ribbon, folded in back to front: right tail, the fold's dark underside, the strand, the top tail -->
    <g transform="translate(61.7 51.7) scale(0.466)">
      <path d="M110.79 192.24 L76.27 268.90 L357.01 143.91 L261.55 63.82 L30.72 166.59ZM287.23 423.78 L353.58 157.66 L240.02 208.22ZM168.77 353.90 L281.14 448.18 L229.61 212.85 L146.04 250.06ZM294.08 442.42 L481.28 359.08 L401.21 333.43 L435.73 256.76 L328.47 304.52Z" fill="#ff2d4f" fill-opacity=".45" filter="url(#glow)"/>
      <path class="fold f1" fill="#D62828" d="M481.28 359.08 L401.21 333.43 L435.73 256.76 L328.47 304.52 L294.08 442.42Z"/>
      <path class="fold f2" fill="#9B1A1A" d="M353.58 157.66 L240.02 208.22 L287.23 423.78Z"/>
      <path class="fold f3" fill="#D62828" d="M168.77 353.90 L281.14 448.18 L229.61 212.85 L146.04 250.06Z"/>
      <path class="fold f4" fill="#D62828" d="M357.01 143.91 L261.55 63.82 L30.72 166.59 L110.79 192.24 L76.27 268.90Z"/>
    </g>

    <text class="rise d1" x="342" y="98" fill="#ff9aab" font-size="15" font-weight="700" letter-spacing="4">CO-FOUNDER OF DEWBLE  ·  A MAKER OF RED RIBBON</text>

    <text class="rise d2" x="340" y="168" fill="#ffffff" font-size="78" font-weight="800" textLength="800" lengthAdjust="spacingAndGlyphs">STEVEN NALIWAJKA</text>

    <!-- an architect's dimension under the name -->
    <g class="rise d3" stroke="#ffb3c0" stroke-opacity=".75" stroke-width="1.5">
      <path d="M340 184V210M1140 184V210"/>
      <path d="M340 197H566M914 197H1140"/>
      <path d="M333 204L347 190M1133 204L1147 190" stroke-width="2.5"/>
    </g>
    <text class="rise d3" x="740" y="202.5" fill="#ffb3c0" font-size="14" font-weight="700" letter-spacing="3" text-anchor="middle" textLength="320" lengthAdjust="spacingAndGlyphs">1,000,000+ LINES OF RUST</text>

    <text class="rise d4" x="340" y="258" fill="#ffffff" font-size="31" font-weight="600">I code and build things.</text>

    <text class="cycle c1" x="341" y="298" fill="#f2c4cd" font-size="19">Red Ribbon · PDF markup and measurement for AEC · getredribbon.com</text>
    <text class="cycle c2" x="341" y="298" fill="#f2c4cd" font-size="19">Printect · custom 3D printing, priced the moment you upload</text>
    <text class="cycle c3" x="341" y="298" fill="#f2c4cd" font-size="19">Everything I build, live at naliwajka.com</text>

    <text x="1176" y="326" fill="#ffffff" fill-opacity=".32" font-size="11" letter-spacing="2.5" text-anchor="end">SHEET A-001 · PROFILE · REV 2026.11</text>
  </g>
</svg>
